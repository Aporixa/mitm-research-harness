[project]
name = "mitm-research-harness"
version = "2.0.0.dev0"
description = "Multi-provider instrumentation harness for coding agents (Claude Code, Codex, Gemini CLI): compares what an agent was asked, what it emitted, what actually ran, and what it reported."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Brian Chastain" }]
dependencies = [
    "bashlex>=0.18",
    "pyyaml>=6",
]

[project.optional-dependencies]
# mitmproxy is only needed where capture runs (inside the container).
capture = ["mitmproxy>=11"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
mrh = "mrh.cli:main"
harness = "mrh.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrh"]

[tool.hatch.build.targets.wheel.force-include]
"docs/dataset-card.md" = "mrh/dataset/card_template.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["mrh"]
ignore_missing_imports = true
warn_unused_ignores = true
